; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/embed_web.py
build_flags =
    -DSSE_MAX_QUEUED_MESSAGES=8
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	adafruit/Adafruit SHT4x Library @ ^1.0.4
	adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit LTR329 and LTR303 @ ^2.0.0
    ESP32Async/AsyncTCP @ ^3.4.0
    ESP32Async/ESPAsyncWebServer @ ^3.9.0

[env:simulation]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DSIMULATION_MODE=1

[env:lux]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DENABLE_LUX_SENSOR=1
